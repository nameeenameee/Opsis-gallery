[package]
name = "opsis_pipeline_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25"         # Đọc, ghi và resize file ảnh
rayon = "1.10"         # Xử lý đa luồng CPU cực nhanh
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"     # Ghi/đọc State dưới dạng JSON
uuid = { version = "1.8", features = ["v4"] }      # Cấp unique ID cho ảnh copy