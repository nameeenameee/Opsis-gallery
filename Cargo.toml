[package]
name = "opsis_pipeline_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png"] }
uuid = { version = "1.11", features = ["v4"] }
eframe = "0.29"
egui = "0.29"
imageproc = "0.25"
arboard = "3.4"
tauri = { version = "2.0", optional = true }

[features]
default = []
tauri-ipc = ["dep:tauri"]